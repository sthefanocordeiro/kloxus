{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kloxus</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">Kloxus</a>
  <span class="tag">the editorial back office</span>
  {{if and .Data.Pub (not .Data.Bare)}}<nav>
    <a href="/pub/{{.Data.Pub.ID}}">{{.Data.Pub.Name}}</a>
    <a href="/pub/{{.Data.Pub.ID}}/sources">Sources</a>
    <a href="/pub/{{.Data.Pub.ID}}/run">Run</a>
    <a href="/pub/{{.Data.Pub.ID}}/guide">Guide</a>
    <a href="/pub/{{.Data.Pub.ID}}/costs">Costs</a>
    <a href="/pub/{{.Data.Pub.ID}}/paywall">Paywall</a>
    <a href="/pub/{{.Data.Pub.ID}}/outbox">Outbox</a>
    <a href="/pub/{{.Data.Pub.ID}}/settings">Settings</a>
  </nav>{{end}}
</header>
<main>
{{.Body}}
</main>
<footer>Kloxus · demo mode · every fact needs a source{{if .Workspace}} · {{.Workspace}}{{end}}</footer>
<script src="/static/app.js"></script>
</body>
</html>{{end}}
