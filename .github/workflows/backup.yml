name: backup

# Nightly logical backup of the production Postgres (Supabase). The
# dump is kept as a workflow artifact for 30 days; restore steps live
# in docs/deploy.md.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC = 03:00 BRT
  workflow_dispatch:

jobs:
  pgdump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install pg_dump
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
      - name: pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # The app may append pgx-only params to DATABASE_URL
          # (default_query_exec_mode) — libpq rejects them, strip first.
          DBURL="${DATABASE_URL//&default_query_exec_mode=exec/}"
          DBURL="${DBURL//?default_query_exec_mode=exec/}"
          /usr/lib/postgresql/17/bin/pg_dump "$DBURL" \
            --format=custom --no-owner --no-privileges \
            --file="kloxus-$(date +%Y%m%d).dump"
      - uses: actions/upload-artifact@v4
        with:
          name: kloxus-pgdump-${{ github.run_number }}
          path: "kloxus-*.dump"
          retention-days: 30
