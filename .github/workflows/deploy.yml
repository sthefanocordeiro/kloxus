name: deploy

on:
  push:
    branches: [main]

# Deploys to the real app are serialized (D35): a stale merge must never
# replace a newer release.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: deploy to Fly
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: smoke check
        run: bash scripts/smoke.sh https://kloxus.fly.dev
