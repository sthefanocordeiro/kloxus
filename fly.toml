# The real app — the target of every deploy in the PR routine (D35).
# `fly deploy` reads this file, so an unqualified deploy can never hit
# kloxus-demo. The demo keeps its own config in fly.demo.toml.
app = "kloxus"
primary_region = "gru"

[build]

# The real app (D27): live feeds + Anthropic. The fixture demo stays on
# kloxus-demo as the fallback URL. KLOXUS_INGEST_DAILY_JOURNAL lives in
# Fly secrets, not here — it must toggle without a redeploy (issue risk).
[env]
KLOXUS_MODE = "real"
KLOXUS_INGEST = "true"
KLOXUS_PORT = "8080"
KLOXUS_DATA_DIR = "/data"
KLOXUS_OUT_DIR = "/data/out"
KLOXUS_PUBLIC_URL = "https://kloxus.fly.dev"

[http_service]
internal_port = 8080
force_https = true
# One machine stays up: the feed scheduler runs inside the web process,
# so a fully stopped app would stop ingesting — and a cold-started
# machine could race a visitor's first run with an empty items table.
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
grace_period = "15s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/healthz"

[mounts]
source = "kloxus_data"
destination = "/data"

[vm]
size = "shared-cpu-1x"
memory = "256mb"
