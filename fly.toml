# The real app — the target of every deploy in the PR routine (D35).
# `fly deploy` reads this file, so an unqualified deploy can never hit
# kloxus-demo. The demo keeps its own config in fly.demo.toml.
app = "kloxus"
primary_region = "gru"

[build]

# The real app (D27): live feeds + Anthropic. The fixture demo keeps its
# own app and config (kloxus-demo / fly.demo.toml) and is never touched
# by deploys of this file.
[env]
KLOXUS_MODE = "real"
KLOXUS_INGEST = "true"
KLOXUS_PORT = "8080"
KLOXUS_DATA_DIR = "/data"
KLOXUS_OUT_DIR = "/data/out"
KLOXUS_PUBLIC_URL = "https://kloxus.fly.dev"
# KLOX-126: a banca on one network opens fresh workspaces.
KLOXUS_NEW_SESSIONS_PER_IP_HOUR = "30"
# AI posture (verified in production 2026-11-25): Generative AI (Claude)
# is enabled in production under hard caps and a live kill switch;
# matching uses Voyage embeddings and reranking, and the AI never writes
# the commentary. Real Anthropic calls run inside the KLOX-67 guards
# (≤2 runs/workspace/day, ≤200k tokens/run, ≤$0.25/run, ≤$1/day, kill
# switch on /admin/llm). No KLOXUS_LLM_MODE secret is deployed, so this
# file is the single source of truth; a deployed secret would override
# it (fly secrets unset KLOXUS_LLM_MODE -a kloxus to restore).
KLOXUS_LLM_MODE = "auto"
# KLOX-256: the 07:00 "your stories are ready" mail — one per saved
# account per day, skipped when the radar's pauta has nothing new.
# Magic links keep priority under the daily email caps.
KLOXUS_DAILY_PAUTA_MAIL = "on"

[http_service]
internal_port = 8080
force_https = true
# One machine stays up: the feed scheduler runs inside the web process,
# so a fully stopped app would stop ingesting — and a cold-started
# machine could race a visitor's first run with an empty items table.
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
grace_period = "15s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/healthz"

[mounts]
source = "kloxus_data"
destination = "/data"

[vm]
size = "shared-cpu-1x"
memory = "256mb"
