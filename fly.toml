app = "kloxus-demo"
primary_region = "gru"

[build]

[env]
KLOXUS_MODE = "demo"
KLOXUS_PORT = "8080"
KLOXUS_DB_PATH = "/data/kloxus.db"
KLOXUS_OUT_DIR = "/data/out"
KLOXUS_DEMO_RESET_INTERVAL = "24h"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/healthz"

[mounts]
source = "kloxus_data"
destination = "/data"
